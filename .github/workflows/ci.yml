name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  solver:
    name: Solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - name: Install
        working-directory: solver
        run: pip install -e ".[dev]"
      - name: Tests
        working-directory: solver
        run: python -m pytest -q
      - name: The seeded week must still solve
        working-directory: solver
        run: python -m rotasolver.cli --self-check

  seed:
    name: Seed SQL is in sync with its generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and diff
        run: |
          python3 supabase/seed/generate_seed.py
          if ! git diff --quiet -- supabase/seed; then
            echo "::error::Seed SQL is out of date. Run supabase/seed/generate_seed.py and commit."
            git diff --stat -- supabase/seed
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Tests
        working-directory: web
        run: npm run test -- --run
