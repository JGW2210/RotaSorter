name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  solver:
    name: Solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - name: Install
        working-directory: solver
        run: pip install -e ".[dev]"
      - name: Tests
        working-directory: solver
        run: python -m pytest -q
      - name: The seeded week must still solve
        working-directory: solver
        run: python -m rotasolver.cli --self-check

  seed:
    name: Generated files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - name: Install solver
        working-directory: solver
        run: pip install -e .
      - name: Seed SQL matches its generator
        run: |
          python3 supabase/seed/generate_seed.py
          if ! git diff --quiet -- supabase/seed; then
            echo "::error::Seed SQL is out of date. Run supabase/seed/generate_seed.py and commit."
            git diff --stat -- supabase/seed
            exit 1
          fi
      # Exported twice on purpose. CP-SAT runs several workers and races
      # between them, so a fixture that records anything varying between
      # equally optimal rotas drifts run to run — which shows up here as an
      # inscrutable "not in sync" rather than as what it is.
      - name: Fixture export is reproducible
        working-directory: solver
        run: |
          set -euo pipefail
          python3 -m rotasolver.export_fixture /tmp/fixtures-a >/dev/null
          python3 -m rotasolver.export_fixture /tmp/fixtures-b >/dev/null
          if ! diff -r /tmp/fixtures-a /tmp/fixtures-b; then
            echo "::error::Two exports of the same input disagree, so the fixtures record"
            echo "::error::something that varies between equally optimal solutions."
            echo "::error::Record the optimum's value and counts, not a particular rota."
            exit 1
          fi
          echo "Two independent exports agree."

      - name: Cross-check fixtures match the reference solver
        working-directory: solver
        run: |
          python3 -m rotasolver.export_fixture ../web/src/solver/__fixtures__
          cd ..
          if ! git diff --quiet -- web/src/solver/__fixtures__; then
            echo "::error::The reference solver now answers differently. If you changed the"
            echo "::error::model on purpose, regenerate and commit:"
            echo "::error::  cd solver && python3 -m rotasolver.export_fixture ../web/src/solver/__fixtures__"
            echo "::error::Otherwise something regressed."
            git diff -- web/src/solver/__fixtures__
            exit 1
          fi

  database:
    name: Migrations and seeds run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: rota
      PGPASSWORD: rota
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run every migration and seed, then check the result
        run: supabase/test/run.sh

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
      - name: Tests, including the cross-check against the reference solver
        working-directory: web
        run: npm run test -- --run
